[project]
name = "alphalens-backend"
version = "0.1.0"
description = "AlphaLens API — FastAPI backend"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# conftest.py must load .env.test before importing any app.* module (those
# call get_settings() at import time), so its app imports can't be at the
# very top of the file.
"tests/conftest.py" = ["E402"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict_optional = true
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_ignores = true
exclude = ["alembic/versions"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# .env.test is loaded explicitly in tests/conftest.py (pytest-env only
# supports the `env` ini option, not `env_files`).
# `live_provider` is excluded by default (unlike `live_llm`, which relies on
# per-test skipif for its missing keys): SEC EDGAR needs no credential to
# skip on, so without this exclusion a plain `pytest` run would make a real
# network call in CI. Phase 10 requires live-provider tests be "explicitly
# gated" — run them with `pytest -m live_provider`.
addopts = "-m 'not live_provider'"
markers = [
    "live_llm: makes a real network call to a real LLM provider (Groq/Gemini/Anthropic) — requires that provider's real API key in the environment; skipped automatically (not failed) when the key is absent. Run explicitly with `pytest -m live_llm`. Plain `pytest` never requires an LLM API key — see docs/security.md.",
    "live_provider: makes a real network call to a real external data provider (SEC EDGAR, Twelve Data, FRED). Excluded from the default run (see `addopts`) since SEC EDGAR needs no credential to gate on otherwise. Run explicitly with `pytest -m live_provider`. Plain `pytest` never touches an external data provider.",
]
