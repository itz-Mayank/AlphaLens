[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "alphalens-ml"
version = "0.1.0"
description = "AlphaLens ML pipeline — feature engineering, training, evaluation, explainability, inference. Standalone package, no web-framework dependency."
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["ml*"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["ml", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
