name: docker-build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          # Both Dockerfiles are multi-stage; omitting `target` builds the
          # LAST stage — `production` for backend, `production` (the nginx
          # static-serving image) for frontend — i.e. exactly what would
          # actually be deployed, not the dev/hot-reload stage
          # docker-compose's local workflow uses.
          push: false
          tags: alphalens-${{ matrix.service }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          load: true

      - name: Scan image for known vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: alphalens-${{ matrix.service }}:ci
          # Fails the job only on HIGH/CRITICAL findings with a known fix
          # available — a scan that fails on every unfixable base-image CVE
          # (common for -slim/-alpine bases) trains everyone to ignore it.
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          exit-code: "1"
