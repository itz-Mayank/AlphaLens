name: backend-ci

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend-ci.yml"]

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # mypy resolves app/'s `import ml...` statements against a real
      # installed package, not just its type stubs — without this, every
      # ml.* import mypy encounters is unresolvable and lint would either
      # false-fail or (with ignore_missing_imports) silently stop checking
      # those call sites at all.
      - run: pip install -e ../ml
      - run: ruff check .
      - run: black --check .
      - run: mypy app

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: alphalens
          POSTGRES_PASSWORD: alphalens
          POSTGRES_DB: alphalens_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alphalens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # The backend imports `ml.inference`/`ml.explainability`/`ml.backtest`/
      # `ml.nlp` throughout (forecast/screener/backtest/sentiment/agent
      # tools) — installed as an editable local package, same as the
      # Dockerfile's `pip install -e /ml` and a local dev checkout's own
      # setup, never published to a package index (see backend/requirements.txt's
      # comment). Without this, nearly the entire suite fails to import.
      - run: pip install -e ../ml
      - name: Apply migrations (validates alembic history against a real DB)
        env:
          DATABASE_URL: postgresql+psycopg://alphalens:alphalens@localhost:5432/alphalens_test
        run: alembic upgrade head
      - name: Verify migrations also downgrade and re-upgrade cleanly
        env:
          DATABASE_URL: postgresql+psycopg://alphalens:alphalens@localhost:5432/alphalens_test
        run: |
          alembic downgrade -1
          alembic upgrade head
      - run: pytest --cov=app --cov-report=term-missing

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — gitleaks scans it, not just the diff
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt pip-audit
      # Known-vulnerability check against the pinned runtime dependency
      # set (requirements.txt only — dev-only tooling in requirements-dev.txt
      # never ships). `--strict` fails the job on any match with no
      # ignorable-by-default suppression.
      - run: pip-audit -r requirements.txt --strict
      - name: Scan for committed secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
