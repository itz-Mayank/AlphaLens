name: ml-ci

on:
  push:
    branches: [main]
    paths: ["ml/**", ".github/workflows/ml-ci.yml"]
  pull_request:
    paths: ["ml/**", ".github/workflows/ml-ci.yml"]

defaults:
  run:
    working-directory: ml

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ml/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: black --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: ml/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # Feature-pipeline, leakage, walk-forward, temporal-split, backtest,
      # registry, and inference-contract tests — 200+ tests as of Phase 10.
      # No editable install needed: pytest's rootdir auto-insertion makes
      # `ml` importable the same way it already does for local dev.
      - run: pytest -q
